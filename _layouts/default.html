<!DOCTYPE html>
<html lang="en">
  <head>
    <title>{% if page.title %}{{ page.title }} – {% endif %}{{ site.name }}</title>
    {% include meta.html %}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400..800&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/iosevka@5.0.11/400.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/iosevka@5.0.11/400-italic.css">
    <link rel="stylesheet" href="{{ site.baseurl }}/style.css?v={{ site.time | date: '%s' }}">
    <link rel="me" href="https://mastodon.social/@cloudmark">
    <link rel="alternate" type="application/atom+xml" title="{{ site.name }}" href="{{ site.baseurl }}/feed.xml">
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <div class="col">
      <header class="top">
        <a class="me" href="{{ site.baseurl }}/" aria-label="Home"><img src="{{ site.avatar }}" alt=""></a>
        <div class="who"><a href="{{ site.baseurl }}/"><b>{{ site.name }}</b></a><span>stay safe, keep hacking!</span></div>
        <nav class="mini" aria-label="Site">
          <a href="{{ site.baseurl }}/"{% if page.url == "/" or page.layout == "post" %} aria-current="page"{% endif %}>Writing</a>
          <a href="{{ site.baseurl }}/about/"{% if page.url == "/about/" %} aria-current="page"{% endif %}>About</a>
          <a href="{{ site.baseurl }}/feed.xml">RSS</a>
        </nav>
      </header>
    </div>

    <main id="main">
      {{ content }}
    </main>

    <div class="col">
      <footer class="end">
        <span class="hand">stay safe, keep hacking!</span>
        <nav aria-label="Elsewhere">
          <a href="https://github.com/{{ site.footer-links.github }}">GitHub</a>
          <a href="https://mastodon.social/@{{ site.footer-links.mastodon }}">Mastodon</a>
          <a href="https://www.linkedin.com/in/{{ site.footer-links.linkedin }}">LinkedIn</a>
          <a href="{{ site.baseurl }}/feed.xml">RSS</a>
        </nav>
      </footer>
    </div>

    {% include analytics.html %}
    <script>
      document.addEventListener('DOMContentLoaded', function () {
        if (window.mermaid) mermaid.initialize({ startOnLoad: true });
      });
    </script>
  </body>
</html>
